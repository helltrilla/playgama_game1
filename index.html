<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Playgama Bridge MUST be the very first script in head, without async or defer -->
    <script src="https://bridge.playgama.com/v2/stable/playgama-bridge.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="description" content="Coins Table - an atmospheric idle game on three.js" />
    <meta name="theme-color" content="#0e0b08" />
    <title>Coins Table</title>
    <style>
      html, body {
        position: fixed;
        inset: 0;
        width: 100% !important;
        height: 100% !important;
        min-width: 100vw;
        min-height: 100vh;
        min-height: 100dvh;
        margin: 0 !important;
        padding: 0 !important;
        overflow: hidden;
        background: radial-gradient(circle at 50% 40%, #2b1d12 0%, #1c130c 100%) !important;
        background-color: #24180f !important;
        color: #f6ebd6;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        touch-action: none;
        font-family: 'Philosopher', system-ui, -apple-system, sans-serif;
      }
      #app {
        position: fixed;
        inset: 0;
        width: 100% !important;
        height: 100% !important;
        background: radial-gradient(circle at 50% 40%, #2b1d12 0%, #1c130c 100%);
        overflow: hidden;
      }
      #canvas-container {
        position: absolute;
        inset: 0;
        width: 100% !important;
        height: 100% !important;
        background: radial-gradient(circle at 50% 40%, #2b1d12 0%, #1c130c 100%);
        z-index: 1;
        touch-action: none;
      }
      #canvas-container canvas {
        display: block;
        width: 100% !important;
        height: 100% !important;
        background: transparent;
        outline: none;
      }
      #ui-root {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 10;
      }
      #ui-root > * {
        pointer-events: auto;
      }
      #loading-screen {
        position: absolute;
        inset: 0;
        z-index: 100;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #0e0b08;
        transition: opacity 0.4s ease;
      }
      #loading-screen.hidden {
        opacity: 0;
        pointer-events: none;
      }
      .loading-logo {
        font-size: 32px;
        font-weight: 700;
        letter-spacing: 2px;
        color: #f2b63d;
        text-shadow: 0 0 20px rgba(242, 182, 61, 0.4);
        margin-bottom: 24px;
      }
      .loading-bar-wrap {
        width: 220px;
        height: 6px;
        background: #251d15;
        border-radius: 999px;
        overflow: hidden;
        border: 1px solid #3a2e20;
      }
      .loading-bar {
        width: 0%;
        height: 100%;
        background: linear-gradient(90deg, #b8801c, #f2b63d, #ffe08a);
        border-radius: 999px;
        transition: width 0.2s ease;
      }
      .loading-text {
        margin-top: 14px;
        font-size: 14px;
        color: #bfae92;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="canvas-container"></div>
      <div id="ui-root"></div>
      <div id="loading-screen">
        <div class="loading-logo">COINS TABLE</div>
        <div class="loading-bar-wrap">
          <div class="loading-bar" id="loading-bar"></div>
        </div>
        <div class="loading-text" id="loading-text">Setting the table…</div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
